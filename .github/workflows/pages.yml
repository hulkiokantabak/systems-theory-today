# Build the public reading site with Eleventy and deploy it to GitHub Pages.
#
# This is the DEPLOY half of the two-surfaces plan (docs/THE_LIVING_DOCUMENT.md §7):
# the repository stays private, but this workflow publishes the *reading* surface.
# It is dormant until the repo is pushed to GitHub and Pages is enabled
# (Settings → Pages → Source: GitHub Actions). Nothing here runs locally.
#
# PATH_PREFIX: leave as "/" for a user/org root or a custom domain. If the site is
# served from https://<user>.github.io/<repo>/, set PATH_PREFIX to "/<repo>/" and
# add the eleventy HTML-base plugin (see site/README.md).

name: Build & deploy reading site (Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Audit installed dependencies
        run: npm run audit:gate
      - name: Run standing checks (references, counts, diagrams)
        run: npm run check
      - name: Build with Eleventy
        run: npm run build
        env:
          # GitHub Pages project site is served under /<repo>/. Override with a
          # repo/Actions variable PATH_PREFIX if the repo slug differs or a custom
          # domain is used (then set it to "/").
          PATH_PREFIX: ${{ vars.PATH_PREFIX || '/systems-theory-today/' }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
